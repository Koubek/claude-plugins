# bcl front door — one port that looks like a Windows BC container.
#
# Why it exists: tools written for Windows BC containers (the AL extension,
# BcContainerHelper-style clients, launch.json-based CLIs such as bcdev) derive
# every URL from a single server:port + serverInstance: publish goes to
# {server}:{port}/BC/dev/apps, test sessions to {server}:{port}/BC/cs/?tenant=default.
# The Linux image serves those on different ports (dev 7049, client services via
# the web client on 8080), so without this proxy such tools get a 404.
#
# Ports here are the CONTAINER-internal ones on the compose network; they never
# change per instance. Only the published host port of this proxy changes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # .app uploads can be large (big ISV apps are 20-50+ MB) and server-side publish
    # of a big extension can take many minutes.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    # Websockets: AL debugger (dev endpoint) and the web client's SignalR.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve "bc" per request (Docker's embedded DNS) so the proxy starts even
    # while the bc container is still booting or is being recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bc bc;

    location /BC/dev/      { proxy_pass http://$bc:7049; }
    location /BC/ODataV4/  { proxy_pass http://$bc:7048; }
    location /BC/api/      { proxy_pass http://$bc:7052; }
    location /BC/          { proxy_pass http://$bc:8080; }   # web client UI + /BC/cs (client services)
    location = /BC         { return 302 /BC/; }
    location = /           { return 302 /BC/; }

    location = /bcl-health { access_log off; return 200 "ok\n"; }
}
